<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Golfbold Statistik</title>

    <link rel="stylesheet" href="index.css">
</head>


<body>

    <!-- =========================
         FORSIDE
    ========================== -->

    <section id="forside" class="side aktiv">

        <div class="forside-indhold">


            <!-- Golfskoven logo -->

            <img
                src="logo.jpg"
                alt="Golfskoven"
                class="logo"
            >


            <!-- Overskrift -->

            <h1>
                Hvilken farve golfbold vandt runden?
            </h1>



            <!-- Golfbolde -->

            <div class="bolde">


                <button
                    class="bold-knap"
                    data-color="hvid"
                >
                    <span>Hvid</span>

                    <div class="bold hvid"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="sort"
                >
                    <span>Sort</span>

                    <div class="bold sort"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="rod"
                >
                    <span>Rød</span>

                    <div class="bold rod"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="gron"
                >
                    <span>Grøn</span>

                    <div class="bold gron"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="gul"
                >
                    <span>Gul</span>

                    <div class="bold gul"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="lilla"
                >
                    <span>Lilla</span>

                    <div class="bold lilla"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="pink"
                >
                    <span>Pink</span>

                    <div class="bold pink"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="orange"
                >
                    <span>Orange</span>

                    <div class="bold orange"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="lysbla"
                >
                    <span>Lys blå</span>

                    <div class="bold lysbla"></div>
                </button>



                <button
                    class="bold-knap"
                    data-color="morkbla"
                >
                    <span>Mørk blå</span>

                    <div class="bold morkbla"></div>
                </button>


            </div>

        </div>



        <!-- Statistik-knap -->

        <button
            id="statistikKnap"
            class="statistik-knap"
        >
            Statistik
        </button>


    </section>



    <!-- =========================
         STATISTIKSIDE
    ========================== -->

    <section id="statistik" class="side">

        <div class="statistik-indhold">


            <h1 class="statistik-titel">
                Samlet statistik
            </h1>


            <p class="runder">

                Runder i alt:

                <strong id="runderIAlt">
                    0
                </strong>

            </p>



            <!-- Søjlediagram -->

            <div
                id="diagram"
                class="diagram"
            >
            </div>


        </div>



        <!-- Tilbage -->

        <button
            id="tilbageKnap"
            class="tilbage-knap"
        >
            ← Tilbage
        </button>



        <!-- Nulstil -->

        <button
            id="nulstilKnap"
            class="nulstil-knap"
        >
            Nulstil statistik
        </button>


    </section>



    <script src="index.js"></script>

</body>

</html>
